name: Deploy Firebase (rules + indexes)
on:
  push:
    branches: [main]
    paths: ["firestore.rules", "firestore.indexes.json", "firebase.json"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npx -y firebase-tools deploy --only firestore:rules,firestore:indexes --project "$PROJECT" --token "$TOKEN" --force
        env:
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          TOKEN: ${{ secrets.FIREBASE_TOKEN }}
