name: Build Android
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Write google-services.json and keystore
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$GS" | base64 -d > android/app/google-services.json
          echo "$KS" | base64 -d > "$RUNNER_TEMP/jenbak.jks"
      - name: Verify signing secrets and keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is missing or empty"; exit 1; fi
          done
          if [ ! -s "$RUNNER_TEMP/jenbak.jks" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing or empty (keystore file not created)"; exit 1
          fi
          keytool -list -keystore "$RUNNER_TEMP/jenbak.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null \
            || { echo "::error::Keystore cannot be opened: wrong KEYSTORE_PASSWORD, wrong KEY_ALIAS, or invalid base64"; exit 1; }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "8.9" }
      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/jenbak.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Verify APK is signed
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          echo "APK: $APK"
          case "$APK" in *unsigned*) echo "::error::APK is UNSIGNED (keystore not applied)"; exit 1;; esac
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)
          "${TOOLS}apksigner" verify --verbose --print-certs "$APK"
      - uses: actions/upload-artifact@v5
        with:
          name: jenbak-apk
          path: android/app/build/outputs/apk/release/*.apk
