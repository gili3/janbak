name: Build Android
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Write google-services.json and keystore
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$GS" | base64 -d > android/app/google-services.json
          echo "$KS" | base64 -d > "$RUNNER_TEMP/jenbak.jks"
      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -s "$RUNNER_TEMP/jenbak.jks" || { echo "::error::ANDROID_KEYSTORE_BASE64 فارغ أو غير صالح"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/jenbak.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::كلمة المرور أو الاسم المستعار (alias) لا يطابقان المفتاح"; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/jenbak.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee sig.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" sig.txt
          if grep -qi "Android Debug" sig.txt; then echo "::error::الـ APK موقّع بمفتاح debug"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: jenbak-apk
          path: android/app/build/outputs/apk/release/*.apk
