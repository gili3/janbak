name: Tests
on:
  push:
  pull_request:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: cd rules-tests && npm install
      - run: npx -y firebase-tools emulators:exec --only firestore --project jenbak-rules-test "npm --prefix rules-tests run test:rules"
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd admin && npm install && npm test && npm run build
        env:
          VITE_FIREBASE_API_KEY: x
          VITE_FIREBASE_AUTH_DOMAIN: x
          VITE_FIREBASE_PROJECT_ID: x
          VITE_FIREBASE_APP_ID: x
  android-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Placeholder google-services.json (unit tests only)
        run: echo '{"project_info":{"project_number":"1","project_id":"x"},"client":[{"client_info":{"mobilesdk_app_id":"1:1:android:1","android_client_info":{"package_name":"com.janbak.com"}},"oauth_client":[{"client_id":"1-x.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"x"}]}],"configuration_version":"1"}' > android/app/google-services.json
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle testDebugUnitTest --no-daemon
        working-directory: android
