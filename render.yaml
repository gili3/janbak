services:
  - type: web
    name: jenbak-admin
    runtime: static
    buildCommand: cd admin && npm install && npm run build
    staticPublishPath: admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - { key: VITE_FIREBASE_API_KEY, sync: false }
      - { key: VITE_FIREBASE_AUTH_DOMAIN, sync: false }
      - { key: VITE_FIREBASE_PROJECT_ID, sync: false }
      - { key: VITE_FIREBASE_APP_ID, sync: false }
